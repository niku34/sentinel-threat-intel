# ============================================================
# Sentinel — Nginx Reverse Proxy for Ollama Security
# Deployment: /etc/nginx/sites-available/ollama-proxy
# Enable:     sudo ln -s /etc/nginx/sites-available/ollama-proxy \
#                        /etc/nginx/sites-enabled/ollama-proxy
#             sudo nginx -t && sudo systemctl reload nginx
#
# After deploying:
#   1. Set OLLAMA_BEARER_TOKEN in api/.env to the same token below
#   2. Set OLLAMA_BASE_URL=http://127.0.0.1:11435 in api/.env
#   3. Block direct access: sudo ufw deny 11434
# ============================================================

# Replace YOUR_STRONG_BEARER_TOKEN_HERE with a random 32+ char token:
#   python3 -c "import secrets; print(secrets.token_hex(32))"

server {
    listen 11435;
    server_name localhost;

    location /api/ {
        # Bearer token validation
        if ($http_authorization != "Bearer YOUR_STRONG_BEARER_TOKEN_HERE") {
            return 401 '{"error": "Unauthorized"}';
            add_header Content-Type application/json;
        }

        proxy_pass         http://127.0.0.1:11434;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Strip the Authorization header before forwarding to Ollama
        proxy_set_header   Authorization "";
    }

    # Block everything except /api/
    location / {
        return 403 '{"error": "Forbidden"}';
    }
}
